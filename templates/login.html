<!DOCTYPE html>
<html>

<head>

    <title>Business Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🔐 Business Login</h1>

    <p>Login to your AI Real Estate CRM</p>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Business Email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

        <p style="color:red">
            {{ error }}
        </p>

    {% endif %}

    <p>
        Don't have an account?
        <a href="/register">Create Business Account</a>
    </p>

</div>

</body>

</html>
